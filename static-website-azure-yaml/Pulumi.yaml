name: ${PROJECT}
description: ${DESCRIPTION}
runtime: yaml

template:
  description: A Pulumi YAML program to deploy a static website on Azure
  config:
    azure-native:location:
      description: The Azure region to deploy into
      default: WestUS
    path:
      description: The path to the folder containing the website
      default: www
    indexDocument:
      description: The file to use for top-level pages
      default: index.html
    errorDocument:
      description: The file to use for error pages
      default: error.html

# Import the program's configuration settings.
config:
  path:
    type: string
    default: www
  indexDocument:
    type: string
    default: index.html
  errorDocument:
    type: string
    default: error.html

# Pull the hostname out of the storage-account endpoint.
variables:
  originHostname:
    fn::select:
      - 2
      - fn::split:
        - /
        - ${account.primaryEndpoints.web}

resources:

  # Create a resource group for the website.
  resource-group:
    type: azure-native:resources:ResourceGroup

  # Create a blob storage account.
  account:
    type: azure-native:storage:StorageAccount
    properties:
      resourceGroupName: ${resource-group.name}
      kind: StorageV2
      sku:
        name: Standard_LRS

  # Configure the storage account as a website.
  website:
    type: azure-native:storage:StorageAccountStaticWebsite
    properties:
      resourceGroupName: ${resource-group.name}
      accountName: ${account.name}
      indexDocument: ${indexDocument}
      error404Document: ${errorDocument}

  # Use a synced folder to manage the files of the website.
  synced-folder:
    type: synced-folder:index:AzureBlobFolder
    properties:
      path: ${path}
      resourceGroupName: ${resource-group.name}
      storageAccountName: ${account.name}
      containerName: ${website.containerName}

# Export the URL and hostname of the storage account's website.
outputs:
  originURL: ${account.primaryEndpoints.web}
  originHostname: ${originHostname}
